name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run build-prod

  test:
    strategy:
      matrix:
        node-version: [16.x]

    name: Run all tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci

      - name: Linter
        run: npm run lint

      - name: Type checking
        run: npm run check-types

      - name: Run unit tests
        run: npm run test

      - name: Run storybook tests
        run: npm run test-storybook:ci

  e2e-visual:
    name: E2E Visual Regression
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Install Cypress binary
        run: bun run cypress:install

      - name: Cache visual baselines
        uses: actions/cache@v4
        with:
          path: cypress/snapshots/base
          key: visual-baselines-${{ github.sha }}
          restore-keys: |
            visual-baselines-

      - name: Run E2E visual tests
        run: bun run cypress:run
        env:
          CYPRESS_APP_URL: https://alpha.openthrone.dev

      - name: Upload visual diff report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-report
          path: |
            cypress/snapshots/diff
            cypress/screenshots
          retention-days: 30
