# .flattener.toml
# Configuration for CodeFlattener by DasTacoMann
# Profiles for packaging OpenThrone codebase with context-related documents

# =============================================================================
# ONBOARDING PROFILE - Project Overview & Getting Started
# =============================================================================
[profiles.onboarding]
description = "Complete project overview for new contributors - includes README, contributing guidelines, and agent instructions"
extensions = [".md", ".json", ".toml", ".js"]
exclude_dirs = ["node_modules", ".next", "dist", "build", ".git", "coverage", "out"]
include_globs = [
    "README.md",
    "CONTRIBUTING.md",
    "AGENTS.md",
    "LICENSE",
    "package.json",
    "tsconfig.json",
    "next.config.js",
    "tailwind.config.js",
    ".env.sample",
    # Key server & socket handlers and account logic
    "src/lib/socket.ts",
    "src/services/Account.service.ts",
    "src/lib/prisma.ts",
    "src/lib/validation.ts",
    "src/server/index.ts",
    # UI pages/components relevant to onboarding
    "src/pages/userprofile/[id].tsx",
    "src/pages/userprofile/**/*.tsx",
    "src/components/UserAdminEditor.tsx",
    # Type definitions and important configs
    "src/types/**/*.d.ts",
]
markdown = true

# =============================================================================
# ARCHITECTURE PROFILE - Tech Stack & Configuration
# =============================================================================
[profiles.architecture]
description = "Full architecture overview - config files, type definitions, middleware, and project structure"
extensions = [".json", ".js", ".ts", ".toml", ".md"]
exclude_dirs = ["node_modules", ".next", "dist", "build", ".git", "coverage", "out"]
include_globs = [
    "README.md",
    "AGENTS.md",
    "package.json",
    "tsconfig.json",
    "next.config.js",
    "tailwind.config.js",
    "postcss.config.js",
    "jest.config.js",
    "cypress.config.js",
    "ecosystem.config.js",
    "next-sitemap.config.js",
    "lint-staged.config.js",
    "netlify.toml",
    "src/middleware/*.ts",
    "src/lib/prisma.ts",
    "src/lib/rate-limiter.ts",
    "src/lib/validation.ts",
    "src/lib/socket.ts",
    "src/server/index.ts",
    "src/services/Account.service.ts",
    "src/pages/userprofile/[id].tsx",
    "src/pages/userprofile/**/*.tsx",
    "src/components/UserAdminEditor.tsx",
    "src/types/**/*.d.ts",
]
markdown = true

